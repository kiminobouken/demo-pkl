<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Tag Lokasi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .kamera {
            position: relative;
            max-width: 450px;
            margin: auto;
            background: black;
            border-radius: 15px;
            overflow: hidden;
        }

        video, #hasilFoto {
            width: 100%;
            display: block;
        }

        .tag {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: left;
            font-size: 13px;
            border-radius: 10px;
        }

        button {
            padding: 12px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            cursor: pointer;
            font-weight: bold;
        }

        #hasilFoto {
            display: none;
        }
    </style>
</head>

<body>

    <h2>Kamera dengan Tag Lokasi</h2>

    <div class="kamera">
        <video id="kamera" autoplay playsinline></video>
        <img id="hasilFoto" alt="Hasil foto">

        <div class="tag">
            <b id="lokasi">Mencari lokasi...</b>
            <p id="koordinat">Menunggu GPS...</p>
            <p id="waktu"></p>
        </div>
    </div>

    <br>

    <button onclick="nyalakanKamera()">
        Nyalakan Kamera
    </button>

    <button onclick="ambilFoto()">
        Ambil Foto
    </button>

    <button onclick="simpanFoto()">
        Simpan Foto
    </button>

    <canvas id="kanvas" style="display:none"></canvas>

    <script>
        const kamera = document.getElementById("kamera");
        const hasilFoto = document.getElementById("hasilFoto");
        const kanvas = document.getElementById("kanvas");

        // Menyalakan kamera belakang
        async function nyalakanKamera() {
            try {
                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "environment"
                        },
                        audio: false
                    });

                kamera.srcObject = stream;
                ambilLokasi();

            } catch (error) {
                alert("Kamera gagal dibuka. Periksa izin kamera.");
            }
        }

        // Mengambil lokasi GPS
        function ambilLokasi() {
            if (!navigator.geolocation) {
                document.getElementById("lokasi").textContent =
                    "GPS tidak didukung browser";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async function (posisi) {
                    const lat = posisi.coords.latitude;
                    const lon = posisi.coords.longitude;

                    document.getElementById("koordinat").textContent =
                        lat.toFixed(6) + ", " + lon.toFixed(6);

                    document.getElementById("lokasi").textContent =
                        "Lokasi terkini";

                    // Mencari nama tempat dari koordinat
                    try {
                        const url =
                            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;

                        const response = await fetch(url);
                        const data = await response.json();
                        const alamat = data.address || {};

                        document.getElementById("lokasi").textContent =
                            alamat.suburb ||
                            alamat.village ||
                            alamat.town ||
                            alamat.city ||
                            alamat.county ||
                            "Lokasi terkini";

                    } catch (error) {
                        // Koordinat tetap ditampilkan jika gagal
                    }
                },

                function () {
                    document.getElementById("lokasi").textContent =
                        "Izin lokasi diperlukan";
                },

                {
                    enableHighAccuracy: true,
                    timeout: 20000
                }
            );
        }

        // Menampilkan tanggal dan waktu
        function perbaruiWaktu() {
            document.getElementById("waktu").textContent =
                new Date().toLocaleString("id-ID");
        }

        perbaruiWaktu();
        setInterval(perbaruiWaktu, 1000);

        // Mengambil foto sekaligus tag lokasi
        function ambilFoto() {
            if (!kamera.videoWidth) {
                alert("Nyalakan kamera terlebih dahulu!");
                return;
            }

            kanvas.width = kamera.videoWidth;
            kanvas.height = kamera.videoHeight;

            const ctx = kanvas.getContext("2d");

            ctx.drawImage(
                kamera, 0, 0,
                kanvas.width, kanvas.height
            );

            const ukuran = kanvas.width / 400;
            const padding = 12 * ukuran;
            const tinggiTag = 100 * ukuran;

            // Latar tag lokasi
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(
                0,
                kanvas.height - tinggiTag,
                kanvas.width,
                tinggiTag
            );

            // Teks tag lokasi
            ctx.fillStyle = "white";
            ctx.font = `${16 * ukuran}px Arial`;

            ctx.fillText(
                document.getElementById("lokasi").textContent,
                padding,
                kanvas.height - 65 * ukuran
            );

            ctx.font = `${12 * ukuran}px Arial`;

            ctx.fillText(
                document.getElementById("koordinat").textContent,
                padding,
                kanvas.height - 42 * ukuran
            );

            ctx.fillText(
                document.getElementById("waktu").textContent,
                padding,
                kanvas.height - 18 * ukuran
            );

            hasilFoto.src = kanvas.toDataURL("image/jpeg", 0.9);
            hasilFoto.style.display = "block";
        }

        // Menyimpan foto ke perangkat
        function simpanFoto() {
            if (!hasilFoto.src ||
                hasilFoto.style.display === "none") {
                alert("Ambil foto terlebih dahulu!");
                return;
            }

            const link = document.createElement("a");
            link.href = hasilFoto.src;
            link.download = "foto-tag-lokasi.jpg";
            link.click();
        }
    </script>

</body>
</html>
